[package]
name = "bz-hub"
version = "0.1.0"
description = "A calm cross-platform launcher for apps, projects and websites"
authors = ["BZ Hub"]
license = "MIT"
repository = "https://github.com/hackerlc/BZ-Hub"
edition = "2021"

[lib]
name = "bz_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
open = "5"
reqwest = { version = "0.13", default-features = false, features = ["gzip", "json", "native-tls", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
